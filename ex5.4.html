<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>5.4 Interação com JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .resultado { margin-top: 15px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <h2>Verificador de Maioridade</h2>
    
    <label for="idadeInput">Digite sua idade:</label>
    <input type="number" id="idadeInput" placeholder="Ex: 18">
    <button onclick="verificarIdade()">Verificar</button>

    <p id="mensagemResultado" class="resultado"></p>

    <script>
        function verificarIdade() {
            // Leitura do valor digitado
            let idade = Number(document.getElementById("idadeInput").value);
            let elementoMensagem = document.getElementById("mensagemResultado");

            // Condicional e atualização de texto
            if (isNaN(idade) || idade <= 0) {
                elementoMensagem.textContent = "Por favor, insira uma idade válida.";
                elementoMensagem.style.color = "red";
            } else if (idade >= 18) {
                elementoMensagem.textContent = "Acesso Permitido: Você é maior de idade!";
                elementoMensagem.style.color = "green";
            } else {
                elementoMensagem.textContent = "Acesso Restrito: Você é menor de idade!";
                elementoMensagem.style.color = "orange";
            }
        }
    </script>
</body>
</html>
