<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>5.5 Document Object Model - DOM</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .box {
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #007bff;
            border-radius: 8px;
        }
        .box-img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; }
        .escondido { display: none; }
    </style>
</head>
<body>
    <h2>Manipulação de Elementos via DOM</h2>

    <button onclick="trocarModo()">Mudar Tema / Imagem</button>
    <button onclick="alternarBox()">Mostrar / Ocultar Caixa</button>

    <div id="minhaBox" class="box">
        <h3 id="tituloBox">Modo Padrão - Estudo</h3>
        <img id="imgDOM" 
             src="https://images.pexels.com/photos/3184360/pexels-photo-3184360.jpeg?auto=compress&cs=tinysrgb&w=800" 
             alt="Pessoa estudando" 
             class="box-img">
        <p id="textoBox">O DOM permite alterar elementos HTML e seus atributos em tempo de execução.</p>
    </div>

    <script>
        let modoFoco = false;

        function trocarModo() {
            let titulo = document.getElementById("tituloBox");
            let img = document.getElementById("imgDOM");
            let texto = document.getElementById("textoBox");

            modoFoco = !modoFoco;

            if (modoFoco) {
                titulo.textContent = "Modo Alta Performance";
                texto.textContent = "Interface alterada dinamicamente via JS!";
                // Imagem Pexels de trabalho focado
                img.src = "https://images.pexels.com/photos/1181671/pexels-photo-1181671.jpeg?auto=compress&cs=tinysrgb&w=800";
            } else {
                titulo.textContent = "Modo Padrão - Estudo";
                texto.textContent = "O DOM permite alterar elementos HTML e seus atributos em tempo de execução.";
                img.src = "https://images.pexels.com/photos/3184360/pexels-photo-3184360.jpeg?auto=compress&cs=tinysrgb&w=800";
            }
        }

        function alternarBox() {
            let box = document.getElementById("minhaBox");
            box.classList.toggle("escondido");
        }
    </script>
</body>
</html>
